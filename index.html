<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIGIMON GIS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2a2c;--side:#0f2a2c;--paper:#f2f4f1;--line:#2c4a4c;--text:#e6efec;--mute:#8fa9a6;
--cust:#4b8f6b;--odp:#e8731a;--pros:#2563eb;--poly:#0e7c7b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
#app{display:grid;grid-template-columns:300px 1fr;height:100%}
aside{background:var(--side);color:var(--text);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
h2{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--mute)}
select,button,input{font:inherit}
select,input{width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);background:#143538;color:var(--text)}
button{cursor:pointer;border:1px solid var(--line);background:#143538;color:var(--text);padding:8px 10px;border-radius:6px}
button:hover{background:#1b4549}
button.on{background:var(--text);color:var(--ink);border-color:var(--text)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #7fe0d4;outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.lg{display:flex;align-items:center;gap:8px;margin:6px 0}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
#areas{display:flex;flex-direction:column;gap:6px}
.area{padding:8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.area:hover{background:#143538}
.area small{color:var(--mute);display:block;margin-top:2px}
#hint{color:var(--mute);font-size:12px}
#map{height:100%}
#map.add{cursor:crosshair}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;display:none;z-index:9999}
#login{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:9998}
#login form{width:300px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
#login input{background:#fff;color:var(--ink);border-color:#c5cfcb}
#login button{background:var(--ink);color:#fff}
.pop button{margin-top:6px;padding:4px 8px;background:#fff;color:#a02020;border-color:#d8b4b4}
.mdl{position:fixed;inset:0;background:rgba(15,42,44,.55);display:none;align-items:center;justify-content:center;z-index:9997;padding:12px}
.mdl .box{background:#fff;color:var(--ink);border-radius:10px;width:min(640px,100%);max-height:94vh;overflow:auto;padding:20px}
.mdl h2{color:var(--ink);font-size:16px;margin:0 0 4px}
.mdl .sub{color:#5b706d;font-size:12px;margin-bottom:14px}
.mdl .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mdl .full{grid-column:1/-1}
.mdl label{display:block;font-size:12px;color:#5b706d;margin-bottom:3px}
.mdl input{background:#fff;color:var(--ink);border-color:#c5cfcb}
.mdl input[readonly]{background:#eef2f0}
.mdl hr{border:0;border-top:1px solid #dde5e2;margin:14px 0}
.mdl .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mdl .act button{flex:none;min-width:90px;color:var(--ink);background:#fff;border-color:#c5cfcb}
.mdl .act button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;color:#fff;font-weight:500}
.pop button.n{color:#0f2a2c;border-color:#c5cfcb;margin-right:4px}
.pop a{color:#0e7c7b}
@media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:42% 58%}}
</style>
</head>
<body>
<div id="login">
  <form id="loginForm">
    <h1>DIGIMON GIS</h1>
    <input id="em" type="email" placeholder="Email" required autocomplete="username">
    <input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
    <button>Masuk</button>
    <span id="lerr" style="color:#a02020"></span>
  </form>
</div>

<div id="app">
  <aside>
    <h1>DIGIMON GIS</h1>
    <div id="who" style="color:var(--mute);font-size:12px;margin-top:-10px"></div>
    <section>
      <h2>Proyek FTTH</h2>
      <select id="project" aria-label="Proyek"></select>
      <div class="row" style="margin-top:8px">
        <button id="newProject">Proyek baru</button>
        <button id="logout">Keluar</button>
      </div>
    </section>
    <section>
      <h2>Tambah titik</h2>
      <div class="row">
        <button id="addOdp">Tambah ODP</button>
        <button id="addPros">Tambah calon</button>
      </div>
      <button id="editPts" type="button" style="margin-top:8px;width:100%">Geser titik (edit posisi)</button>
      <div id="hint" style="margin-top:8px">Pilih mode, lalu klik peta. Klik tombol lagi untuk batal.</div>
    </section>
    <section>
      <h2>Layer</h2>
      <label class="lg"><input type="checkbox" data-k="customer" checked style="width:auto"><span class="dot" style="background:var(--cust)"></span>Pelanggan (UN ID)</label>
      <label class="lg"><input type="checkbox" data-k="odp" checked style="width:auto"><span class="dot" style="background:var(--odp)"></span>ODP</label>
      <label class="lg"><input type="checkbox" data-k="prospect" checked style="width:auto"><span class="dot" style="background:var(--pros)"></span>Calon pelanggan</label>
      <div id="count" style="color:var(--mute);font-size:12px"></div>
    </section>
    <section>
      <h2>Area proyek</h2>
      <div id="areas"><span id="empty" style="color:var(--mute)">Belum ada area. Gambar polygon di peta.</span></div>
    </section>
  </aside>
  <div id="map"></div>
</div>
<div id="modal" class="mdl" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <h2 id="mTitle">Form Order Desain FTTH</h2>
    <div class="sub">Isi Nama Polygon dan pilih STO. Data wilayah terisi otomatis.</div>
    <div class="grid">
      <div><label for="fCode">Polygon ID</label><input id="fCode" readonly></div>
      <div><label for="fName">Nama Polygon</label><input id="fName" maxlength="80"></div>
      <div><label for="fCust">Total Pelanggan</label><input id="fCust" readonly></div>
      <div><label for="fOdp">Total ODP</label><input id="fOdp" readonly></div>
    </div>
    <hr>
    <div class="grid">
      <div class="full"><label for="fSto">STO (ketik kode atau nama)</label><input id="fSto" list="stoList" autocomplete="off" placeholder="mis. BWG atau Banyuwangi"><datalist id="stoList"></datalist></div>
      <div><label for="fNama">Nama STO</label><input id="fNama" readonly></div>
      <div><label for="fArea">Area</label><input id="fArea" readonly></div>
      <div><label for="fReg">Regional</label><input id="fReg" readonly></div>
      <div><label for="fBranch">Branch</label><input id="fBranch" readonly></div>
      <div><label for="fCluster">Cluster</label><input id="fCluster" readonly></div>
      <div><label for="fWok">WOK</label><input id="fWok" readonly></div>
      <div><label for="fDist">District</label><input id="fDist" readonly></div>
      <div><label for="fSub">Sub District</label><input id="fSub" readonly></div>
      <div class="full"><label for="fKab">Kabupaten/Kota</label><input id="fKab" readonly></div>
    </div>
    <div class="act"><button id="mCancel" type="button">Batal</button><button id="mSave" type="button" class="pri">Simpan</button></div>
  </div>
</div>
<div id="modal2" class="mdl" role="dialog" aria-modal="true" aria-labelledby="m2Title">
  <div class="box">
    <h2 id="m2Title"></h2><div class="sub" id="m2Sub"></div>
    <div class="grid" id="m2Body"></div>
    <div class="act"><button id="m2Cancel" type="button">Batal</button><button id="m2Save" type="button" class="pri">Simpan</button></div>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== KONFIGURASI ======
const SUPABASE_URL = 'https://ydgkmaartnysppyonpub.supabase.co';
const SUPABASE_KEY = 'sb_publishable_P9DOBZjAe1th0L7X5UdvLg_uMpJb6u8';   // anon key aman di frontend karena RLS aktif
const MIN_ZOOM = 12, LIMIT = 5000;
// =========================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL = {customer:'#4b8f6b', odp:'#e8731a', prospect:'#2563eb'};
const LABEL = {customer:'Pelanggan', odp:'ODP', prospect:'Calon pelanggan'};
let mode = null, project = null, timer;

function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const debounce=(fn,ms=300)=>(...a)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...a),ms)};

// ---- Peta ----
const map = L.map('map',{preferCanvas:true}).setView([-2.5,118],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const layers = {customer:L.layerGroup().addTo(map), odp:L.layerGroup().addTo(map), prospect:L.layerGroup().addTo(map)};
const areas = new L.FeatureGroup().addTo(map);
const drawCtl=new L.Control.Draw({
  edit:{featureGroup:areas},
  draw:{polygon:{allowIntersection:false,shapeOptions:{color:'#0e7c7b'}},rectangle:{shapeOptions:{color:'#0e7c7b'}},
        polyline:false,circle:false,marker:false,circlemarker:false}
});
map.addControl(drawCtl);
document.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{
  const l=layers[c.dataset.k]; c.checked?map.addLayer(l):map.removeLayer(l)});

// ---- Titik ----
async function loadPoints(){
  if(editPts&&map.getZoom()<15){editPts=false;$('editPts').classList.remove('on')}
  if(map.getZoom()<MIN_ZOOM){Object.values(layers).forEach(l=>l.clearLayers());$('count').textContent=`Zoom in (min. ${MIN_ZOOM}) untuk melihat titik`;return}
  const b=map.getBounds();
  const {data,error}=await sb.rpc('get_points',{w:b.getWest(),s:b.getSouth(),e:b.getEast(),n:b.getNorth(),lim:LIMIT});
  if(error) return toast('Gagal memuat titik: '+error.message);
  Object.values(layers).forEach(l=>l.clearLayers());
  data.features.forEach(f=>{
    const p=f.properties,[x,y]=f.geometry.coordinates;
    const m=editPts
      ? L.marker([y,x],{draggable:true,icon:L.divIcon({className:'',iconSize:[14,14],html:`<span style="display:block;width:14px;height:14px;border-radius:50%;background:${COL[p.kind]};border:2px solid #fff;box-shadow:0 0 0 1px #0006"></span>`})})
      : L.circleMarker([y,x],{radius:p.kind==='customer'?4:7,color:'#fff',weight:1,fillColor:COL[p.kind],fillOpacity:.95});
    if(editPts) m.on('dragend',ev=>movePoint(p.id,ev.target.getLatLng()));
    m.bindPopup(`<div class="pop"><b>${LABEL[p.kind]}</b><br>${p.un_id?'UN ID: '+esc(p.un_id)+'<br>':''}${p.name?esc(p.name)+'<br>':''}${y.toFixed(6)}, ${x.toFixed(6)}<br><button onclick="delPoint('${p.id}')">Hapus titik</button></div>`);
    layers[p.kind].addLayer(m);
  });
  $('count').textContent=`${data.features.length} titik di layar`+(data.features.length>=LIMIT?` (dibatasi ${LIMIT}, zoom in)`:'');
}
async function delPoint(id){
  if(!confirm('Hapus titik ini?')) return;
  const {error}=await sb.from('points').delete().eq('id',id);
  error?toast(error.message):(map.closePopup(),loadPoints());
}
function setMode(m){
  mode=(mode===m)?null:m;
  $('addOdp').classList.toggle('on',mode==='odp');
  $('addPros').classList.toggle('on',mode==='prospect');
  $('map').classList.toggle('add',!!mode);
}
$('addOdp').onclick=()=>setMode('odp');
$('addPros').onclick=()=>setMode('prospect');
map.on('click',async e=>{
  if(!mode) return;
  const name=prompt(mode==='odp'?'Nama/kode ODP:':'Nama calon pelanggan:');
  if(name===null) return;
  const {error}=await sb.from('points').insert({kind:mode,name:name.trim()||null,lat:e.latlng.lat,lng:e.latlng.lng});
  error?toast(error.message):(toast(LABEL[mode]+' ditambahkan'),loadPoints());
});

// ---- Polygon (CRUD) ----
const areaLayer = f => {
  const l=L.geoJSON(f,{style:{color:SC[f.properties.status]||'#0e7c7b',weight:2,fillOpacity:.12}}).getLayers()[0];
  l.feature=f;
  const p=f.properties;
  l.bindPopup(()=>areaPopup(p));
  return l;
};
async function loadAreas(){
  if(!project){areas.clearLayers();renderList([]);return}
  const {data,error}=await sb.rpc('get_areas',{p_project:project});
  if(error) return toast(error.message);
  areas.clearLayers();
  data.features.forEach(f=>areas.addLayer(areaLayer(f)));
  renderList(data.features);
}
function renderList(fs){
  const box=$('areas'); box.innerHTML='';
  if(!fs.length){box.innerHTML='<span style="color:var(--mute)">Belum ada area. Gambar polygon di peta.</span>';return}
  fs.forEach(f=>{
    const p=f.properties,d=document.createElement('div');d.className='area';
    d.innerHTML=`${esc(p.name)} ${badge(p.status)}<small>${esc(p.code||'')} ${p.sto_code?'· '+esc(p.sto_code):'· STO belum dipilih'}<br>${p.customer} pelanggan, ${p.odp} ODP, ${p.prospect} calon</small>`;
    d.onclick=()=>{areas.eachLayer(l=>{if(l.feature.properties.id===p.id){map.fitBounds(l.getBounds());l.openPopup()}})};
    box.appendChild(d);
  });
}
const saveGeom=(id,name,layer)=>sb.rpc('upsert_area',{p_id:id,p_project:project,p_name:name,p_geojson:layer.toGeoJSON().geometry,p_code:null,p_sto:null});
map.on(L.Draw.Event.CREATED, async e=>{
  if(!project) return toast('Pilih atau buat proyek dulu');
  const geo=e.layer.toGeoJSON().geometry;
  const [{data:cnt,error:e1},{data:code,error:e2}]=await Promise.all([
    sb.rpc('count_in_geojson',{p_geojson:geo}), sb.rpc('next_area_code')]);
  if(e1||e2) return toast((e1||e2).message);
  openOrder({layer:e.layer,geo,code,customer:cnt.customer,odp:cnt.odp,name:'Area '+(areas.getLayers().length+1)});
});
map.on(L.Draw.Event.EDITED, async e=>{
  for(const l of e.layers.getLayers()){
    const {error}=await saveGeom(l.feature.properties.id,l.feature.properties.name,l);
    if(error) toast(error.message);
  }
  toast('Perubahan area disimpan'); loadAreas();
});
map.on(L.Draw.Event.DELETED, async e=>{
  const ids=e.layers.getLayers().map(l=>l.feature.properties.id);
  const {error}=await sb.from('project_areas').delete().in('id',ids);
  error?toast(error.message):toast('Area dihapus'); loadAreas();
});
// ---- Peran & status ----
let ROLE=null, editPts=false, dlgSave=null;
const SL={submitted:'Submitted',revision:'Revision',designed:'Designed',completed:'Completed'};
const SC={submitted:'#2563eb',revision:'#d97706',designed:'#7c3aed',completed:'#15803d'};
const badge=st=>`<span class="st" style="background:${SC[st]||'#666'}">${SL[st]||esc(st)}</span>`;
const isPlan=()=>ROLE==='planner'||ROLE==='admin', isDes=()=>ROLE==='designer'||ROLE==='admin';
function applyRole(){
  $('who').textContent=ROLE?('Peran: '+({planner:'Planner (User A)',designer:'Designer (User B)',admin:'Admin'}[ROLE])):'Peran belum diatur';
  if(!ROLE) toast('Akun belum punya peran. Hubungi admin.');
  if(!isPlan()){
    map.removeControl(drawCtl);
    ['addOdp','addPros','editPts','newProject'].forEach(id=>$(id).style.display='none');
  }
}
function areaPopup(p){
  let h=`<div class="pop"><b>${esc(p.name)}</b> ${badge(p.status)}<br>${esc(p.code||'')}${p.sto_code?' · STO '+esc(p.sto_code):''}<br>Pelanggan: ${p.customer} · ODP: ${p.odp} · Calon: ${p.prospect}`;
  if(p.dsi_id) h+=`<br>DSI: ${esc(p.dsi_id)} (${esc(p.dsi_name)})`;
  if(p.kml_path) h+=`<br><a href="#" onclick="dl('${esc(p.kml_path)}');return false">KML</a> · <a href="#" onclick="dl('${esc(p.boq_path)}');return false">BOQ</a>`;
  h+='<br>';
  if(isPlan()&&p.status!=='completed') h+=`<button class="n" onclick="editOrder('${p.id}')">Form order</button>`;
  if(isDes()&&['submitted','revision','designed'].includes(p.status)) h+=`<button class="n" onclick="uploadDesign('${p.id}')">Upload desain</button>`;
  if(isPlan()&&p.status==='designed') h+=`<button class="n" onclick="inputDsi('${p.id}')">Input DSI</button>`;
  return h+'</div>';
}
async function dl(path){
  const {data,error}=await sb.storage.from('designs').createSignedUrl(path,60);
  error?toast(error.message):window.open(data.signedUrl,'_blank');
}
function openDialog(title,sub,body,onSave){
  $('m2Title').textContent=title;$('m2Sub').textContent=sub;$('m2Body').innerHTML=body;
  dlgSave=onSave;$('modal2').style.display='flex';
}
const closeDialog=()=>{$('modal2').style.display='none';dlgSave=null};
$('m2Cancel').onclick=closeDialog;
$('modal2').addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
$('m2Save').onclick=async()=>{
  if(!dlgSave) return; $('m2Save').disabled=true;
  try{await dlgSave()}catch(err){toast(err.message)}finally{$('m2Save').disabled=false}
};
function uploadDesign(id){
  map.closePopup();
  openDialog('Upload desain','Kedua file wajib. Setelah berhasil, status menjadi Designed.',
    `<div class="full"><label for="uKml">File desain (.kml)</label><input id="uKml" type="file" accept=".kml"></div>
     <div class="full"><label for="uBoq">File BOQ (.xlsx)</label><input id="uBoq" type="file" accept=".xlsx"></div>`,
    async()=>{
      const k=$('uKml').files[0], b=$('uBoq').files[0];
      if(!k||!b) return toast('Pilih file KML dan BOQ');
      if(!/\.kml$/i.test(k.name)||!/\.xlsx$/i.test(b.name)) return toast('Format harus .kml dan .xlsx');
      const t=Date.now(), safe=n=>n.replace(/[^A-Za-z0-9._-]/g,'_');
      const kp=`${id}/${t}_${safe(k.name)}`, bp=`${id}/${t}_${safe(b.name)}`, st=sb.storage.from('designs');
      let r=await st.upload(kp,k,{contentType:'application/vnd.google-earth.kml+xml'}); if(r.error) return toast(r.error.message);
      r=await st.upload(bp,b); if(r.error) return toast(r.error.message);
      const {error}=await sb.rpc('mark_designed',{p_area:id,p_kml:kp,p_boq:bp});
      if(error) return toast(error.message);
      closeDialog(); toast('Desain terupload. Status: Designed'); loadAreas();
    });
}
function inputDsi(id){
  map.closePopup();
  openDialog('Input DSI','Setelah disimpan, status menjadi Completed dan polygon terkunci.',
    `<div><label for="dId">DSI ID</label><input id="dId" maxlength="40"></div>
     <div><label for="dNm">DSI Name</label><input id="dNm" maxlength="120"></div>`,
    async()=>{
      const a=$('dId').value.trim(), n=$('dNm').value.trim();
      if(!a||!n) return toast('DSI ID dan DSI Name wajib diisi');
      const {error}=await sb.rpc('complete_area',{p_area:id,p_dsi_id:a,p_dsi_name:n});
      if(error) return toast(error.message);
      closeDialog(); toast('Status: Completed'); loadAreas();
    });
}
// Geser posisi titik (ODP / pelanggan / calon) -> polygon terkait menjadi Revision
$('editPts').onclick=()=>{
  if(!editPts&&map.getZoom()<15) return toast('Zoom in (min. 15) untuk menggeser titik');
  editPts=!editPts; $('editPts').classList.toggle('on',editPts);
  if(editPts) setMode(null);
  loadPoints();
};
async function movePoint(id,ll){
  const {error}=await sb.from('points').update({lat:ll.lat,lng:ll.lng}).eq('id',id);
  toast(error?error.message:'Posisi diperbarui');
  loadPoints(); loadAreas();
}

// ---- Form order (modal) ----
let STO=[], order=null;
async function loadSto(){
  const {data,error}=await sb.from('sto').select('*').order('sto');
  if(error) return toast('Gagal memuat STO: '+error.message);
  STO=data;
  $('stoList').innerHTML=STO.map(s=>`<option value="${esc(s.sto)}">${esc(s.nama_sto||'')} (${esc(s.kabupaten_kota||'')})</option>`).join('');
}
const F={nama:'fNama',area:'fArea',regional:'fReg',branch:'fBranch',cluster:'fCluster',wok:'fWok',district:'fDist',sub_district:'fSub',kabupaten_kota:'fKab'};
function fillSto(code){
  const s=STO.find(x=>x.sto===code.trim().toUpperCase());
  for(const [k,id] of Object.entries(F)) $(id).value=s?(s[k==='nama'?'nama_sto':k]||''):'';
  return s;
}
$('fSto').oninput=e=>{
  let v=e.target.value.trim();
  if(!STO.some(x=>x.sto===v.toUpperCase())){ // cocokkan juga lewat nama STO jika unik
    const m=STO.filter(x=>(x.nama_sto||'').toUpperCase()===v.toUpperCase());
    if(m.length===1) v=m[0].sto;
  }
  fillSto(v);
};
function openOrder(o){
  order=o;
  $('fCode').value=o.code||''; $('fName').value=o.name||'';
  $('fCust').value=o.customer??0; $('fOdp').value=o.odp??0;
  $('fSto').value=o.sto_code||''; fillSto(o.sto_code||'');
  $('modal').style.display='flex'; $('fName').focus();
}
function editOrder(id){
  const l=areas.getLayers().find(x=>x.feature.properties.id===id); if(!l) return;
  const p=l.feature.properties; map.closePopup();
  openOrder({id,code:p.code,name:p.name,customer:p.customer,odp:p.odp,sto_code:p.sto_code});
}
const closeOrder=()=>{$('modal').style.display='none';order=null};
$('mCancel').onclick=closeOrder;
$('modal').addEventListener('keydown',e=>{if(e.key==='Escape')closeOrder()});
$('mSave').onclick=async()=>{
  const name=$('fName').value.trim(), sto=$('fSto').value.trim().toUpperCase();
  if(!name) return toast('Nama polygon wajib diisi');
  if(!STO.some(x=>x.sto===sto)) return toast('Pilih STO yang valid dari daftar');
  let error;
  if(order.id){ ({error}=await sb.from('project_areas').update({name,sto_code:sto}).eq('id',order.id)); }
  else { ({error}=await sb.rpc('upsert_area',{p_id:null,p_project:project,p_name:name,p_geojson:order.geo,p_code:order.code,p_sto:sto})); }
  if(error) return toast(error.message);
  closeOrder(); toast('Order disubmit. Status: Submitted'); loadAreas();
};

// ---- Proyek ----
async function loadProjects(){
  const {data,error}=await sb.from('projects').select('id,name').order('created_at');
  if(error) return toast(error.message);
  const s=$('project'); s.innerHTML=data.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')||'<option value="">(belum ada proyek)</option>';
  project=data.length?(data.find(p=>p.id===project)?.id||data[0].id):null; s.value=project||'';
  loadAreas();
}
$('project').onchange=e=>{project=e.target.value||null;loadAreas()};
$('newProject').onclick=async()=>{
  const name=prompt('Nama proyek FTTH:'); if(!name) return;
  const {data,error}=await sb.from('projects').insert({name:name.trim()}).select().single();
  if(error) return toast(error.message);
  project=data.id; loadProjects();
};

// ---- Realtime ----
function subscribe(){
  sb.channel('live')
    .on('postgres_changes',{event:'*',schema:'public',table:'points'},debounce(loadPoints,500))
    .on('postgres_changes',{event:'*',schema:'public',table:'project_areas'},debounce(loadAreas,500))
    .subscribe();
}
map.on('moveend',debounce(loadPoints));

// ---- Auth ----
async function start(){
  $('login').style.display='none';
  ROLE=(await sb.rpc('my_role')).data; applyRole();
  await Promise.all([loadProjects(),loadSto()]);
  const {data}=await sb.rpc('data_extent');
  if(data) map.fitBounds([[data.s,data.w],[data.n,data.e]]); else loadPoints();
  subscribe();
}
$('loginForm').onsubmit=async e=>{
  e.preventDefault();
  if(SUPABASE_URL.includes('YOUR-PROJECT')||SUPABASE_KEY.includes('YOUR_ANON')){
    $('lerr').textContent='SUPABASE_URL dan SUPABASE_KEY di index.html belum diisi'; return;
  }
  $('lerr').textContent='';
  try{
    const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
    if(error){$('lerr').textContent=error.message;console.error(error);return}
    await start();
  }catch(err){$('lerr').textContent='Gagal terhubung: '+err.message;console.error(err)}
};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>{if(data.session) start()});
</script>
