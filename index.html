<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIGIMON GIS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2a2c;--side:#0f2a2c;--paper:#f2f4f1;--line:#2c4a4c;--text:#e6efec;--mute:#8fa9a6;
--cust:#4b8f6b;--odp:#e8731a;--pros:#2563eb;--poly:#0e7c7b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
body{display:flex;flex-direction:column}
#app{display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0}
.top{display:flex;align-items:center;gap:14px;background:var(--ink);color:#e6efec;padding:0 16px;height:48px;flex:none;border-bottom:1px solid #1d3d3f}
.top nav{display:flex;gap:4px}.top nav a{color:#bcd0cc;text-decoration:none;padding:6px 12px;border-radius:8px}.top nav a.on{background:#e6efec;color:var(--ink)}
.top .sp{flex:1}.top .sub{color:#8fa9a6;font-size:12px}.top button{padding:6px 12px}
aside{background:var(--side);color:var(--text);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
h2{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--mute)}
select,button,input{font:inherit}
select,input{width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);background:#143538;color:var(--text)}
button{cursor:pointer;border:1px solid var(--line);background:#143538;color:var(--text);padding:8px 10px;border-radius:6px}
button:hover{background:#1b4549}
button.on{background:var(--text);color:var(--ink);border-color:var(--text)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #7fe0d4;outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.lg{display:flex;align-items:center;gap:8px;margin:6px 0}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
#areas{display:flex;flex-direction:column;gap:6px}
.area{padding:8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.area:hover{background:#143538}
.area small{color:var(--mute);display:block;margin-top:2px}
#hint{color:var(--mute);font-size:12px}
#map{height:100%}
#map.add{cursor:crosshair}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;display:none;z-index:9999}
#login{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:9998}
#login form{width:300px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
#login input{background:#fff;color:var(--ink);border-color:#c5cfcb}
#login button{background:var(--ink);color:#fff}
.pop button{margin-top:6px;padding:4px 8px;background:#fff;color:#a02020;border-color:#d8b4b4}
.st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;color:#fff;font-weight:500}
.pop button.n{color:#0f2a2c;border-color:#c5cfcb;margin-right:4px}
.pop a{color:#0e7c7b}
.sl{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}.sl:first-of-type{margin-top:0}
.srow{display:flex;gap:6px}.srow input{flex:1;min-width:0}.srow button{flex:none;padding:8px 12px}
#sRes{margin-top:6px}#sRes .li{padding:7px 8px;border:1px solid var(--line);border-radius:6px;margin-top:4px;cursor:pointer;font-size:12px}#sRes .li:hover{background:#143538}
.pager{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;font-size:12px;color:var(--mute)}
.pager button{padding:5px 10px;font-size:12px}.pager button:disabled{opacity:.4;cursor:not-allowed}
#mapwrap{position:relative;height:100%;min-width:0;overflow:hidden}
#bar{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:4px;background:rgba(15,42,44,.95);padding:6px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.3);max-width:calc(100% - 16px);overflow-x:auto}
#bar .grp{display:flex;align-items:center;gap:4px;padding:0 6px;border-left:1px solid var(--line)}
#bar .grp:first-child{border-left:0}
#bar button{background:transparent;border:0;color:var(--text);padding:8px 12px;border-radius:8px;white-space:nowrap}
#bar button:hover:not(:disabled){background:#1b4549}
#bar button.on{background:var(--text);color:var(--ink)}
#bar button:disabled{opacity:.35;cursor:not-allowed}
#bar .dot{width:10px;height:10px;margin-right:6px}
#bar .chip{color:#7fe0d4;font-size:12px;white-space:nowrap;padding:0 4px}
#bHint{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);z-index:1000;background:#fff;color:var(--ink);padding:6px 12px;border-radius:8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none;max-width:calc(100% - 24px);text-align:center}
.mdl{display:none}
.gpop{font-family:'IBM Plex Sans',system-ui,sans-serif}
.gpop .leaflet-popup-content-wrapper{border-radius:12px}
.gpop .leaflet-popup-content{margin:10px 12px;font-size:12px;line-height:1.35;color:var(--ink)}
.gpop .box{width:min(340px,68vw)}
.gpop h2{display:flex;align-items:center;gap:6px;font-size:14px;margin:0 22px 2px 0;color:var(--ink)}
.gpop h2 .st{margin-left:6px}
.gpop .sub{color:#5b706d;font-size:11px;margin-bottom:8px}
.gpop .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.gpop .grid.g3{grid-template-columns:1fr 1fr 1fr}
.gpop .full{grid-column:1/-1}
.gpop label{display:block;font-size:11px;color:#5b706d;margin-bottom:2px}
.gpop input{padding:5px 7px;font-size:12px;background:#fff;color:var(--ink);border-color:#c5cfcb;text-overflow:ellipsis}
.gpop input[readonly]{background:#eef2f0}
.gpop hr{border:0;border-top:1px solid #dde5e2;margin:8px 0}
.gpop .act{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:10px}
.gpop .act button{flex:none;min-width:64px;padding:5px 10px;font-size:12px;color:var(--ink);background:#fff;border-color:#c5cfcb}
.gpop .act button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.gpop .act button.dng{color:#a02020;border-color:#e0b8b8}
.gpop .act .sp{flex:1}
.gpop #vActs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gpop #vActs button{width:100%;min-width:0;padding:7px 10px}
.gpop .val{padding:3px 0;border-bottom:1px solid #e3e9e6;min-height:22px;word-break:break-word}
.gpop .nil{color:#9aaaa7}
.gpop .sec{grid-column:1/-1;font-size:11px;font-weight:600;color:#0e7c7b;margin-top:4px}
@media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:42% 58%}}
/* ---- Tampilan compact ---- */
html,body{font-size:13px}
.top{height:42px;gap:10px;padding:0 12px}
.top nav a{padding:5px 10px}
aside{padding:12px;gap:12px}
h2{font-size:12px;margin:0 0 6px}
select,input{padding:5px 8px}
button{padding:5px 9px}
.lg{margin:4px 0}
.area{padding:6px 8px}.area small{margin-top:1px}
.sl{margin:8px 0 3px}
.pager{margin-top:6px}
#bar{padding:4px;bottom:26px}#bar button{padding:6px 10px}#bar .grp{padding:0 4px}
#bHint{bottom:76px;font-size:11.5px;padding:5px 10px}
.gpop .leaflet-popup-content{margin:8px 10px}
.gpop .box{width:min(320px,68vw)}
.gpop .grid{gap:5px 8px}
.gpop .val{padding:2px 0;min-height:20px}
.gpop .act{margin-top:8px}
.gpop input{padding:4px 6px}
.pop .pi{border-collapse:collapse;margin:4px 0 2px}.pop .pi td{padding:1px 8px 1px 0;vertical-align:top;font-size:12px}.pop .pi td:first-child{color:#5b706d;white-space:nowrap}
.gpop textarea{width:100%;padding:4px 6px;font:inherit;font-size:12px;border:1px solid #c5cfcb;border-radius:6px;resize:vertical;color:var(--ink);background:#fff}
</style>
</head>
<body>
<div id="login">
  <form id="loginForm">
    <h1>DIGIMON GIS</h1>
    <input id="em" type="email" placeholder="Email" required autocomplete="username">
    <input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
    <button>Masuk</button>
    <span id="lerr" style="color:#a02020"></span>
  </form>
</div>

<header class="top"><b>DIGIMON GIS</b>
  <nav><a class="on" href="index.html">Peta Polygon</a><a href="table.html">List Polygon</a></nav>
  <span class="sp"></span><span class="sub" id="who"></span><button id="logout" type="button">Keluar</button></header>
<div id="app">
  <aside>
    <section>
      <h2>Pencarian</h2>
      <label class="sl" for="sLat">Koordinat (latitude, longitude)</label>
      <div class="srow"><input id="sLat" placeholder="-7.2575" inputmode="decimal"><input id="sLng" placeholder="112.7521" inputmode="decimal"><button id="sGoC" type="button">Cari</button></div>
      <label class="sl" for="sId">ID Polygon / Nama Polygon</label>
      <div class="srow"><input id="sId" placeholder="PLY-00001 atau nama" autocomplete="off"><button id="sGoP" type="button">Cari</button></div>
      <div id="sRes"></div>
    </section>
    <section>
      <h2>Layer</h2>
      <label class="lg"><input type="checkbox" data-k="customer" checked style="width:auto"><span class="dot" style="background:var(--cust)"></span>Pelanggan (UN ID)</label>
      <label class="lg"><input type="checkbox" data-k="odp" checked style="width:auto"><span class="dot" style="background:var(--odp)"></span>ODP Plan</label>
      <label class="lg"><input type="checkbox" data-k="prospect" checked style="width:auto"><span class="dot" style="background:var(--pros)"></span>Demand</label>
      <label class="lg"><input type="checkbox" id="lyKml" style="width:auto"><span class="dot" style="background:#e11d48"></span>Desain (KML)</label>
      <div id="kmlInfo" style="color:var(--mute);font-size:12px"></div>
      <div id="count" style="color:var(--mute);font-size:12px"></div>
    </section>
    <section>
      <h2>Daftar polygon</h2>
      <div id="areas"><span id="empty" style="color:var(--mute)">Belum ada area. Gambar polygon di peta.</span></div>
      <div class="pager" id="pager"></div>
    </section>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="bHint" role="status"></div>
<div id="modal" class="mdl" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <h2 id="mTitle">Form Order Desain FTTH</h2>
    <div class="sub" id="mSub">Isi nama polygon dan pilih STO.</div>
    <div class="grid g3">
      <div><label for="fCode">Polygon ID</label><input id="fCode" readonly></div>
      <div><label for="fCust">Total Pelanggan</label><input id="fCust" readonly></div>
      <div><label for="fOdp">Total ODP</label><input id="fOdp" readonly></div>
      <div class="full"><label for="fName">Nama Polygon</label><input id="fName" maxlength="80"></div>
    </div>
    <hr>
    <div class="grid">
      <div class="full"><label for="fSto">STO (ketik kode atau nama)</label><input id="fSto" list="stoList" autocomplete="off" placeholder="mis. BWG atau Banyuwangi"><datalist id="stoList"></datalist></div>
      <div><label for="fNama">Nama STO</label><input id="fNama" readonly></div>
      <div><label for="fArea">Area</label><input id="fArea" readonly></div>
      <div><label for="fReg">Regional</label><input id="fReg" readonly></div>
      <div><label for="fBranch">Branch</label><input id="fBranch" readonly></div>
      <div><label for="fCluster">Cluster</label><input id="fCluster" readonly></div>
      <div><label for="fWok">WOK</label><input id="fWok" readonly></div>
      <div><label for="fDist">District</label><input id="fDist" readonly></div>
      <div><label for="fSub">Sub District</label><input id="fSub" readonly></div>
      <div class="full"><label for="fKab">Kabupaten/Kota</label><input id="fKab" readonly></div>
    </div>

  </div>
</div>
<div id="modalView" class="mdl" role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="box">
    <h2 id="vTitle">Resume Order</h2>
    <div class="sub">Ringkasan order. Tekan Edit untuk mengubah form order.</div>
    <div class="grid" id="vBody"></div>
    <div class="act" id="vActs"></div>
  </div>
</div>
<div id="modal2" class="mdl" role="dialog" aria-modal="true" aria-labelledby="m2Title">
  <div class="box">
    <h2 id="m2Title"></h2><div class="sub" id="m2Sub"></div>
    <div class="grid" id="m2Body"></div>
    <div class="act"><button id="m2Cancel" type="button">Batal</button><button id="m2Save" type="button" class="pri">Simpan</button></div>
  </div>
</div>
<div id="modalPt" class="mdl" role="dialog" aria-modal="true" aria-labelledby="ptTitle">
  <div class="box" style="width:min(300px,68vw)">

    <div class="grid">
      <div><label for="ptId" id="ptIdL">ID</label><input id="ptId" readonly></div>
      <div><label for="ptNm" id="ptNmL">Name</label><input id="ptNm" readonly></div>

  </div>
</div>
    <div id="bar" role="toolbar" aria-label="Tools peta">
      <div class="grp">
        <button id="tPoly" type="button" title="Gambar polygon">Polygon</button>
        <button id="tRect" type="button" title="Gambar kotak">Kotak</button>

        <button id="addOdp" type="button"><span class="dot" style="background:var(--odp)"></span>ODP Plan</button>
        <button id="addPros" type="button"><span class="dot" style="background:var(--pros)"></span>Demand</button>
      </div>
      <div class="grp">
        <button id="tEditPoly" type="button" disabled title="Klik polygon lalu tekan Edit">Edit Polygon</button>

      </div>
      <div class="grp" id="gSess" style="display:none"><span class="chip" id="sessTxt"></span><button id="sessForm" type="button" class="on">Selesai</button><button id="sessEnd" type="button">Batal</button></div>
      <div class="grp" id="gDraw" style="display:none"><button id="cUndo" type="button">Undo titik</button><button id="cCancel" type="button">Batal</button></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
// ====== KONFIGURASI ====== (URL & anon key ada di config.js)
const MIN_ZOOM = 12, LIMIT = 5000;
// =========================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL = {customer:'#4b8f6b', odp:'#e8731a', prospect:'#2563eb'};
const LABEL = {customer:'Pelanggan', odp:'ODP Plan', prospect:'Demand'};
let mode = null, timer;

// ---- Notifikasi = modal HTML (pengganti toast, alert, dan confirm) ----
const NMK = {success:['#15803d','✓','Berhasil'], error:['#b91c1c','!','Terjadi kesalahan'], warn:['#d97706','!','Perhatian'], info:['#0e7c7b','i','Informasi'], confirm:['#d97706','?','Konfirmasi']};
let nmQ = [], nmCur = null, nmTimer = null;
function nmKind(m){
  if(/gagal|error|violat|denied|terkunci|ditolak|tidak ditemukan|tidak bisa|salah|failed|not found|permission/i.test(m)) return 'error';
  if(/wajib|harus|Selesaikan|Pilih |Zoom in|belum|tidak valid|invalid|Koordinat/i.test(m)) return 'warn';
  if(/disimpan|ditambahkan|diperbarui|dihapus|terupload|disubmit|Status:|berhasil|dibatalkan/i.test(m)) return 'success';
  return 'info';
}
function nmEl(){
  let el = document.getElementById('nm'); if(el) return el;
  const st = document.createElement('style');
  st.textContent = `#nm{position:fixed;inset:0;background:rgba(15,42,44,.55);display:none;align-items:center;justify-content:center;z-index:20000;padding:16px}
#nm .nb{background:#fff;color:#0f2a2c;border-radius:12px;width:min(380px,100%);padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.4);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;text-align:center}
#nm .ni{width:44px;height:44px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:700}
#nm .nt{font-weight:600;font-size:15px;margin-bottom:4px}
#nm .nx{color:#3d5553;white-space:pre-line;word-break:break-word;margin-bottom:14px}
#nm .na{display:flex;gap:8px;justify-content:center}
#nm .na button{min-width:88px;padding:8px 14px;border-radius:8px;border:1px solid #c5cfcb;background:#fff;color:#0f2a2c;cursor:pointer;font:inherit}
#nm .na button.pri{background:#0f2a2c;color:#fff;border-color:#0f2a2c}
#nm .na button.dng{background:#a02020;color:#fff;border-color:#a02020}
#nm .na button:focus-visible{outline:2px solid #0e7c7b;outline-offset:2px}`;
  document.head.appendChild(st);
  el = document.createElement('div'); el.id = 'nm';
  el.innerHTML = '<div class="nb" role="alertdialog" aria-modal="true" aria-labelledby="nmt" aria-describedby="nmx"><div class="ni" id="nmi"></div><div class="nt" id="nmt"></div><div class="nx" id="nmx"></div><div class="na" id="nma"></div></div>';
  el.addEventListener('click', e => { if(e.target === el) nmClose(false); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && nmCur){ e.stopPropagation(); nmClose(false); } }, true);
  document.body.appendChild(el);
  return el;
}
function nmShow(){
  if(nmCur || !nmQ.length) return;
  nmCur = nmQ.shift();
  const el = nmEl(), k = NMK[nmCur.type] || NMK.info, g = id => document.getElementById(id);
  g('nmi').style.background = k[0]; g('nmi').textContent = k[1];
  g('nmt').textContent = k[2]; g('nmx').textContent = nmCur.msg;
  const a = g('nma'); a.innerHTML = '';
  const mk = (txt, cls, val) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; if(cls) b.className = cls; b.onclick = () => nmClose(val); a.appendChild(b); return b; };
  let main;
  if(nmCur.type === 'confirm'){ mk('Batal', '', false); main = mk(nmCur.ok, 'dng', true); }
  else main = mk('OK', 'pri', true);
  el.style.display = 'flex'; main.focus();
  if(nmCur.type === 'success' || nmCur.type === 'info') nmTimer = setTimeout(() => nmClose(true), 2400);
}
function nmClose(v){
  if(!nmCur) return;
  clearTimeout(nmTimer); document.getElementById('nm').style.display = 'none';
  const c = nmCur; nmCur = null; c.res(v); nmShow();
}
function notify(msg, type){
  const m = String(msg);
  if((nmCur && nmCur.msg === m) || (nmQ.length && nmQ[nmQ.length-1].msg === m)) return Promise.resolve(true);   // jangan menumpuk pesan sama
  return new Promise(res => { nmQ.push({msg:m, type:type || nmKind(m), res}); nmShow(); });
}
function ask(msg, okLabel){ return new Promise(res => { nmQ.push({msg:String(msg), type:'confirm', ok:okLabel || 'Ya', res}); nmShow(); }); }
function toast(msg, type){ notify(msg, type); }   // nama lama tetap dipakai di seluruh kode
const debounce=(fn,ms=300)=>(...a)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...a),ms)};

// ---- Peta ----
const map = L.map('map',{preferCanvas:true}).setView([-2.5,118],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const layers = {customer:L.layerGroup().addTo(map), odp:L.layerGroup().addTo(map), prospect:L.layerGroup().addTo(map)};
const areas = new L.FeatureGroup().addTo(map);
document.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{
  const l=layers[c.dataset.k]; c.checked?map.addLayer(l):map.removeLayer(l)});

// ---- Titik ----
async function loadPoints(){
  if(map.getZoom()<MIN_ZOOM){Object.values(layers).forEach(l=>l.clearLayers());$('count').textContent=`Zoom in (min. ${MIN_ZOOM}) untuk melihat titik`;return}
  const b=map.getBounds();

const geoCache = new Map(); let geoLast = 0, geoChain = Promise.resolve();
function formatAddress(j){
  if(!j || j.error) return '';
  const a = j.address || {};
  const road = [a.road || a.pedestrian || a.footway || a.path, a.house_number].filter(Boolean).join(' ');
  const parts = [road, a.neighbourhood || a.hamlet, a.suburb || a.village, a.city_district || a.subdistrict || a.district,
                 a.city || a.town || a.municipality || a.county, a.state, a.postcode].filter(Boolean);
  return [...new Set(parts)].join(', ') || String(j.display_name || '').replace(/, Indonesia$/, '');
}
function geocode(lat, lng){
  const key = lat.toFixed(5) + ',' + lng.toFixed(5);
  if(geoCache.has(key)) return Promise.resolve(geoCache.get(key));
  const run = async () => {
    const wait = geoLast + 1100 - Date.now(); if(wait > 0) await new Promise(r => setTimeout(r, wait));
    geoLast = Date.now();
    try{
      const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 8000);
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=id&lat=${lat}&lon=${lng}`, {signal:ac.signal});
      clearTimeout(tm);
      if(!r.ok) return null;
      const a = formatAddress(await r.json());
      if(a) geoCache.set(key, a);
      return a || null;
    }catch(e){ return null; }
  };
  const p = geoChain.then(run); geoChain = p.catch(() => {}); return p;
}

async function insertPoints(rows){

    if(!error) return null;
    if(error.code !== '23505' || !/un_id/.test((error.message || '') + (error.details || ''))) return error;
    rows.forEach(r => { r.un_id = genCode(r.kind); });

}

    :`<span>${listRows.length} polygon</span>`;
  if(pages>1){$('pgPrev').onclick=()=>{listPage--;drawList()}; $('pgNext').onclick=()=>{listPage++;drawList()}}
}

// ---- KML di peta (terhubung ke Polygon ID) ----
function parseKml(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('File KML tidak valid');
  const pts=el=>{const c=el.getElementsByTagName('coordinates')[0];if(!c)return[];
    return c.textContent.trim().split(/\s+/).map(t=>t.split(',').slice(0,2).map(Number)).filter(a=>a.length===2&&isFinite(a[0])&&isFinite(a[1]))};
  const ring=el=>{const r=el.getElementsByTagName('LinearRing')[0];return r?pts(r):[]};
  const feats=[];
  for(const pm of doc.getElementsByTagName('Placemark')){
    const props={name:pm.getElementsByTagName('name')[0]?.textContent||'',desc:pm.getElementsByTagName('description')[0]?.textContent||''};
    const add=g=>feats.push({type:'Feature',properties:props,geometry:g});
    for(const e of pm.getElementsByTagName('Point')){const c=pts(e)[0];if(c)add({type:'Point',coordinates:c})}
    for(const e of pm.getElementsByTagName('LineString')){const c=pts(e);if(c.length>1)add({type:'LineString',coordinates:c})}
    for(const e of pm.getElementsByTagName('Polygon')){
      const o=e.getElementsByTagName('outerBoundaryIs')[0]; if(!o) continue;
      const rings=[ring(o),...[...e.getElementsByTagName('innerBoundaryIs')].map(ring)].filter(r=>r.length>3);
      if(rings.length) add({type:'Polygon',coordinates:rings});
    }
  }
  if(!feats.length) throw new Error('KML tidak berisi objek (Point/LineString/Polygon)');
  return {type:'FeatureCollection',features:feats};
}
// Layer "Desain (KML)": memuat desain polygon yang sedang terlihat di peta
const KML_MIN_ZOOM=12, KML_BATCH=10;
const kmlInfo=m=>{$('kmlInfo').textContent=m||''};
async function loadKmlFor(p){
  const {data,error}=await sb.storage.from('designs').download(p.kml_path);
  if(error) throw new Error(error.message);
  const gj=parseKml(await data.text());
  const lyr=L.geoJSON(gj,{
    style:f=>f.geometry.type==='Polygon'?{color:'#7c3aed',weight:2,fillOpacity:.1}:{color:'#e11d48',weight:3},
    pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:'#fff',weight:1,fillColor:'#7c3aed',fillOpacity:1}),
    onEachFeature:(f,l)=>l.bindPopup(`<b>${esc(f.properties.name||'(tanpa nama)')}</b><br>Desain ${esc(p.code||'')}${f.properties.desc?'<br>'+esc(f.properties.desc.slice(0,300)):''}`)
  });
  kmlGroup.addLayer(lyr); kmlLayers[p.id]={lyr,path:p.kml_path};
}
function hideKml(id){if(kmlLayers[id]){kmlGroup.removeLayer(kmlLayers[id].lyr);delete kmlLayers[id]}}
async function syncKml(){            // dipanggil saat layer dinyalakan, peta bergerak, atau polygon dimuat ulang
  if(!kmlOn||kmlBusy) return;
  for(const id of Object.keys(kmlLayers)){                           // buang desain yang sudah diganti / polygon terhapus
    const p=areaFeatures.find(f=>f.properties.id===id)?.properties;
    if(!p||!p.kml_path||p.kml_path!==kmlLayers[id].path) hideKml(id);
  }
  if(map.getZoom()<KML_MIN_ZOOM){kmlInfo(`Zoom in (min. ${KML_MIN_ZOOM}) untuk memuat desain`);return}
  const b=map.getBounds();
  const todo=areaFeatures.map(f=>f.properties)
    .filter(p=>p.kml_path&&!kmlLayers[p.id]&&!kmlFail.has(p.id+'|'+p.kml_path)&&layerOf(p.id)?.getBounds().intersects(b)).slice(0,KML_BATCH);
  const n=()=>Object.keys(kmlLayers).length;
  if(!todo.length){kmlInfo(n()?`${n()} desain ditampilkan`:'Tidak ada desain di layar');return}
  kmlBusy=true; kmlInfo('Memuat desain...');
  const errs=[];
  await Promise.all(todo.map(p=>loadKmlFor(p).catch(e=>{kmlFail.add(p.id+'|'+p.kml_path);errs.push(`${p.code}: ${e.message}`)})));
  kmlBusy=false; kmlInfo(`${n()} desain ditampilkan`);
  if(errs.length) toast('Gagal memuat sebagian desain: '+errs.slice(0,3).join('; '),'error');
  syncKml();                                                          // lanjutkan bila masih ada sisa
}
$('lyKml').onchange=e=>{
  kmlOn=e.target.checked;
  if(kmlOn){kmlGroup.addTo(map);syncKml()}else{map.removeLayer(kmlGroup);kmlInfo('')}
};
map.on('moveend',()=>{clearTimeout(kmlT);kmlT=setTimeout(syncKml,400)});

// ---- Form order (modal) ----
let STO=[], order=null;
async function loadSto(){
  const {data,error}=await sb.from('sto').select('*').order('sto');
  if(error) return toast('Gagal memuat STO: '+error.message);
  STO=data;
  $('stoList').innerHTML=STO.map(s=>`<option value="${esc(s.sto)}">${esc(s.nama_sto||'')} (${esc(s.kabupaten_kota||'')})</option>`).join('');
}
const F={nama:'fNama',area:'fArea',regional:'fReg',branch:'fBranch',cluster:'fCluster',wok:'fWok',district:'fDist',sub_district:'fSub',kabupaten_kota:'fKab'};
function fillSto(code){
  const s=STO.find(x=>x.sto===code.trim().toUpperCase());
  for(const [k,id] of Object.entries(F)){ $(id).value=s?(s[k==='nama'?'nama_sto':k]||''):''; $(id).title=$(id).value }
  return s;
}
$('fSto').oninput=e=>{
  let v=e.target.value.trim();
  if(!STO.some(x=>x.sto===v.toUpperCase())){ // cocokkan juga lewat nama STO jika unik
    const m=STO.filter(x=>(x.nama_sto||'').toUpperCase()===v.toUpperCase());
    if(m.length===1) v=m[0].sto;
  }
  fillSto(v);
};
function openOrder(o){
  closePanel();
  order=o;
  $('mTitle').textContent=o.id?'Update Polygon':'Form Order Desain FTTH';
  $('mSub').textContent=o.edit?o.summary:(o.id?'Perubahan nama atau STO akan mengubah status menjadi Revision Polygon.':'Isi Nama Polygon dan pilih STO. Data wilayah terisi otomatis.');
  $('mSave').textContent=o.id?'Update':'Simpan'; $('mSave').disabled=!!o.loading;
  $('fCode').value=o.code||''; $('fName').value=o.name||'';
  $('fCust').value=o.customer??0; $('fOdp').value=o.odp??0;
  $('fSto').value=o.sto_code||''; fillSto(o.sto_code||'');
  showPanel('order',o.ll||anchorLL||map.getCenter(),()=>{const o2=order;order=null;clearPreview();if(o2&&o2.edit&&session&&!o2.saved)resumeEdit()}); $('fName').focus();
}
function editOrder(id,ll){
  const p=areaFeatures.find(x=>x.properties.id===id)?.properties; if(!p) return;

const closeOrder=()=>{if(panel&&panel.name==='order')closePanel()};
$('mCancel').onclick=closeOrder;
$('modal').addEventListener('keydown',e=>{if(e.key==='Escape')closeOrder()});
$('mSave').onclick=async()=>{
  const name=$('fName').value.trim(), sto=$('fSto').value.trim().toUpperCase();
  if(!name) return toast('Nama polygon wajib diisi');
  if(!STO.some(x=>x.sto===sto)) return toast('Pilih STO yang valid dari daftar');
  if(order.edit) return saveEdit(name,sto);
  $('mSave').disabled=true;
  const {error}=await sb.rpc('upsert_area',{p_id:null,p_name:name,p_geojson:order.geo,p_code:order.code,p_sto:sto});
  $('mSave').disabled=false;
  if(error) return toast(error.message,'error');
  closeOrder(); toast('Order disubmit. Status: Submitted Polygon'); loadAreas();
};
// Simpan semua perubahan sesi edit sekaligus: titik digeser, bentuk polygon, data form, titik baru
async function saveEdit(name,sto){
  const id=order.id, l=layerOf(id), cur=areaFeatures.find(f=>f.properties.id===id)?.properties||{};
  const geoChanged=!!l&&geoOf(l)!==origGeo, dataChanged=name!==cur.name||sto!==cur.sto_code;
  const moves=Object.entries(pendingMoves), adds=pendingAdds.slice();
  $('mSave').disabled=true;
  try{
    for(let i=0;i<moves.length;i+=20){
      const rs=await Promise.all(moves.slice(i,i+20).map(([pid,ll])=>sb.from('points').update({lat:ll.lat,lng:ll.lng}).eq('id',pid)));
      const bad=rs.find(r=>r.error); if(bad) throw new Error(bad.error.message);
    }
    if(geoChanged){const {error}=await saveGeom(id,name,l); if(error) throw new Error(error.message)}
    if(dataChanged){const {error}=await sb.from('project_areas').update({name,sto_code:sto}).eq('id',id); if(error) throw new Error(error.message)}
    if(adds.length){const error=await insertPoints(adds.map(a=>({kind:a.kind,un_id:a.un_id,name:a.name,note:a.note,address:a.address,lat:a.lat,lng:a.lng}))); if(error) throw new Error(error.message)}
  }catch(err){$('mSave').disabled=false; return toast(err.message,'error')}
  $('mSave').disabled=false;
  order.saved=true; closeOrder(); finishSession();
  toast(moves.length||adds.length||geoChanged||dataChanged?'Perubahan disimpan. Status: Revision Polygon':'Tidak ada perubahan');
  await loadAreas(); loadPoints();
  const jobs=moves.filter(([pid,m])=>m.kind==='odp'||m.kind==='prospect'); if(jobs.length) refreshAddresses(jobs);   // alamat titik yang digeser, di latar belakang
}

    .subscribe();
}
